<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', "Segoe UI", sans-serif;
            background-color: #f8f8f8;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            gap: 30px;
        }
        .left-column { flex: 1.5; }
        .right-column { flex: 1; }
        .section {
            background-color: #fff;
            padding: 25px 30px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-img { width: 90px; height: 110px; object-fit: cover; border-radius: 4px; margin-right: 20px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-name { font-weight: 500; margin-bottom: 8px; }
        .cart-item-price { color: #888; font-size: 14px; }
        .cart-item-quantity { display: flex; align-items: center; }
        .quantity-btn {
            background: #f5f5f5;
            border: 1px solid #ddd;
            cursor: pointer;
            width: 32px;
            height: 32px;
            font-size: 18px;
        }
        .quantity-input {
            width: 45px;
            text-align: center;
            border: 1px solid #ddd;
            border-left: none;
            border-right: none;
            height: 32px;
        }
        .cart-item-total { font-weight: bold; min-width: 120px; text-align: right; }
        .cart-item-remove {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 22px;
            margin-left: 20px;
        }
        .cart-item-remove:hover { color: #d9534f; }
        .summary-item { display: flex; justify-content: space-between; padding: 10px 0; }
        .summary-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #ccc;
            padding-top: 15px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .place-order-button {
            display: block; /* *** SỬA Ở ĐÂY: Chuyển thành block để nhận margin *** */
            width: 100%;
            padding: 12px;
            background-color: #212529;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .place-order-button:hover { background-color: #424649; }
        .empty-cart-message { text-align: center; padding: 50px; color: #777; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="/">Coatify</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item dropdown" th:if="${isAuthenticated}">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-2"></i>
                        <span th:text="${username}"></span>
                    </a>
                </li>
                <li class="nav-item ms-3">
                    <a class="nav-link p-0 position-relative" th:href="@{/giohang}">
                        <i class="bi bi-bag-fill fs-5"></i>
                        <span class="cart-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="checkout-wrapper">
        <!-- CỘT TRÁI - CHI TIẾT GIỎ HÀNG -->
        <div class="left-column">
            <div class="section">
                <h2 class="section-title">Giỏ hàng của bạn</h2>

                <!-- Trường hợp giỏ hàng có sản phẩm -->
                <div th:if="${cartItems != null and !cartItems.isEmpty()}">
                    <div th:each="item : ${cartItems}" class="cart-item" th:data-id="${item.idGioHangChiTiet}">
                        <img th:src="@{${item.hinhAnh}}" alt="Hình sản phẩm" class="cart-item-img"/>
                        <div class="cart-item-info">
                            <p class="cart-item-name" th:text="${item.tenSanPham}">Tên sản phẩm</p>
                            <p class="cart-item-price" th:text="${item.giaSanPham}">Giá</p>
                        </div>
                        <div class="cart-item-quantity">
                            <button class="quantity-btn" th:onclick="'updateQuantity(' + ${item.idGioHangChiTiet} + ', ' + (${item.soLuong} - 1) + ')'">-</button>
                            <input type="number" class="quantity-input" th:value="${item.soLuong}" readonly />
                            <button class="quantity-btn" th:onclick="'updateQuantity(' + ${item.idGioHangChiTiet} + ', ' + (${item.soLuong} + 1) + ')'">+</button>
                        </div>
                        <span class="cart-item-total" th:text="${item.tongTien}">Tổng tiền</span>
                        <button class="cart-item-remove" th:onclick="'removeItem(' + ${item.idGioHangChiTiet} + ')'">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Trường hợp giỏ hàng trống -->
                <div th:if="${cartItems == null or cartItems.isEmpty()}" class="empty-cart-message">
                    <p>Chưa có sản phẩm trong giỏ của bạn.</p>
                    <a href="/" class="btn btn-dark mt-3">Tiếp tục mua sắm</a>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI - TÓM TẮT ĐƠN HÀNG -->
        <div class="right-column">
            <div class="section">
                <h2 class="section-title">Tóm tắt đơn hàng</h2>
                <div class="summary-item" th:if="${loggedInUser}">
                    <span>Khách hàng</span>
                    <span th:text="${loggedInUser}"></span>
                </div>
                <div class="summary-item" th:if="${userPhone}">
                    <span>Số điện thoại</span>
                    <span th:text="${userPhone}"></span>
                </div>
                <div class="summary-total">
                    <span>Tổng cộng</span>
                    <span th:text="${grandTotal}">0₫</span>
                </div>
                <a th:href="@{/checkout}" class="place-order-button mt-4 text-center text-decoration-none">TIẾN HÀNH ĐẶT HÀNG</a>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        updateCartCount();
    });

    function updateCartCount() {
        fetch('/api/cart/count', { credentials: 'include' })
            .then(response => response.json())
            .then(count => {
                updateCartBadge(count);
            })
            .catch(error => {
                console.error('Error fetching cart count:', error);
                updateCartBadge(0);
            });
    }

    function updateCartBadge(count) {
        const badges = document.querySelectorAll('.cart-badge');
        badges.forEach(badge => {
            if (badge) {
                badge.textContent = count || 0;
            }
        });
    }

    function updateQuantity(cartItemId, newQuantity) {
        if (newQuantity === 0) {
            removeItem(cartItemId);
            return;
        }
        fetch('/api/cart/update', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gioHangChiTietId: cartItemId, soLuong: newQuantity })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.reload();
            } else {
                alert(data.message);
            }
        })
        .catch(error => console.error('Lỗi khi cập nhật giỏ hàng:', error));
    }

    function removeItem(cartItemId) {
        if (confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?')) {
            fetch(`/api/cart/remove/${cartItemId}`, { method: 'DELETE' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => console.error('Lỗi khi xóa sản phẩm:', error));
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
